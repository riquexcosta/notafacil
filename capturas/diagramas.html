<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Diagramas — NotaFácil</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  section { padding: 14px; }
  svg { display: block; background: #fff; }

  /* Tipografia dimensionada para leitura a 16 cm de largura impressa:
     fonte/largura do viewBox >= 0,016 mantém o texto acima de 7 pt. */
  .rotulo         { font: 700 19px Arial, Helvetica, sans-serif; fill: #16202c; }
  .rotulo-pequeno { font: 15px Arial, Helvetica, sans-serif; fill: #4d5b6b; }
  .caso           { font: 17px Arial, Helvetica, sans-serif; fill: #10243e; text-anchor: middle; }
  .titulo-sistema { font: bold 20px Arial, Helvetica, sans-serif; fill: #10243e; }
  .estereotipo    { font: italic 15px Arial, Helvetica, sans-serif; fill: #6b7a8c; text-anchor: middle; }
  .linha     { stroke: #4d5b6b; stroke-width: 1.8; fill: none; }
  .tracejada { stroke: #7d8a99; stroke-width: 1.7; stroke-dasharray: 7 5; fill: none; }
  .elipse    { fill: #eef4fb; stroke: #2563a8; stroke-width: 1.8; }
  .fronteira { fill: none; stroke: #16202c; stroke-width: 2; }
  .ator      { stroke: #16202c; stroke-width: 2.2; fill: none; }

  .tabela-nome { font: bold 18px Arial, Helvetica, sans-serif; fill: #fff; }
  .campo       { font: 16px 'Courier New', monospace; fill: #16202c; }
  .campo-chave { font: bold 16px 'Courier New', monospace; fill: #10243e; }
  .nota-modelo { font: italic 15px Arial, Helvetica, sans-serif; fill: #6b7a8c; }
  .cardinalidade { font: bold 16px Arial, Helvetica, sans-serif; fill: #b3261e; }

  .camada-titulo { font: bold 17px Arial, Helvetica, sans-serif; fill: #10243e; }
  .componente    { font: 16px Arial, Helvetica, sans-serif; fill: #16202c; text-anchor: middle; }
  .nota-arq      { font: 15px Arial, Helvetica, sans-serif; fill: #4d5b6b; text-anchor: middle; }
</style>
</head>
<body>

<!-- ================================================= 1. CASOS DE USO -->
<section>
<svg id="casos-de-uso" width="1060" height="700" viewBox="0 0 1060 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8a99" />
    </marker>
  </defs>

  <g class="ator" transform="translate(66,300)">
    <circle cx="0" cy="0" r="18" />
    <line x1="0" y1="18" x2="0" y2="60" />
    <line x1="-26" y1="32" x2="26" y2="32" />
    <line x1="0" y1="60" x2="-22" y2="98" />
    <line x1="0" y1="60" x2="22" y2="98" />
  </g>
  <text class="rotulo" x="66" y="424" text-anchor="middle">Consumidor</text>

  <g class="ator" transform="translate(986,168)">
    <circle cx="0" cy="0" r="18" />
    <line x1="0" y1="18" x2="0" y2="60" />
    <line x1="-26" y1="32" x2="26" y2="32" />
    <line x1="0" y1="60" x2="-22" y2="98" />
    <line x1="0" y1="60" x2="22" y2="98" />
  </g>
  <text class="rotulo" x="986" y="292" text-anchor="middle">SEFAZ</text>
  <text class="rotulo-pequeno" x="986" y="312" text-anchor="middle">(via Infosimples)</text>

  <rect class="fronteira" x="190" y="22" width="650" height="654" rx="6" />
  <text class="titulo-sistema" x="515" y="52" text-anchor="middle">NotaFácil</text>

  <!-- coluna esquerda -->
  <ellipse class="elipse" cx="352" cy="96"  rx="146" ry="30" />
  <text class="caso" x="352" y="102">Autenticar-se</text>

  <ellipse class="elipse" cx="352" cy="200" rx="146" ry="32" />
  <text class="caso" x="352" y="206">Registrar nota fiscal</text>

  <ellipse class="elipse" cx="362" cy="286" rx="132" ry="26" />
  <text class="caso" x="362" y="292">Ler QR Code</text>

  <ellipse class="elipse" cx="362" cy="344" rx="132" ry="26" />
  <text class="caso" x="362" y="350">Informar chave</text>

  <ellipse class="elipse" cx="362" cy="402" rx="132" ry="26" />
  <text class="caso" x="362" y="408">Importar XML</text>

  <ellipse class="elipse" cx="352" cy="490" rx="146" ry="30" />
  <text class="caso" x="352" y="496">Consultar histórico</text>

  <ellipse class="elipse" cx="352" cy="562" rx="146" ry="30" />
  <text class="caso" x="352" y="568">Buscar produto</text>

  <ellipse class="elipse" cx="352" cy="634" rx="146" ry="30" />
  <text class="caso" x="352" y="640">Ver produtos recorrentes</text>

  <!-- coluna direita -->
  <ellipse class="elipse" cx="700" cy="168" rx="128" ry="40" />
  <text class="caso" x="700" y="162">Obter dados do</text>
  <text class="caso" x="700" y="182">documento fiscal</text>

  <ellipse class="elipse" cx="700" cy="300" rx="128" ry="40" />
  <text class="caso" x="700" y="294">Comparar preços</text>
  <text class="caso" x="700" y="314">com o histórico</text>

  <ellipse class="elipse" cx="700" cy="552" rx="128" ry="40" />
  <text class="caso" x="700" y="546">Comparar preço</text>
  <text class="caso" x="700" y="566">entre estabelecimentos</text>

  <!-- associações do ator -->
  <g class="linha">
    <line x1="94" y1="316" x2="212" y2="110" />
    <line x1="94" y1="322" x2="208" y2="194" />
    <line x1="94" y1="336" x2="208" y2="482" />
    <line x1="94" y1="342" x2="208" y2="554" />
    <line x1="94" y1="348" x2="208" y2="626" />
  </g>

  <!-- variantes de registro -->
  <g class="tracejada">
    <line x1="230" y1="286" x2="206" y2="286" />
    <line x1="230" y1="344" x2="206" y2="344" />
    <line x1="230" y1="402" x2="206" y2="402" />
    <line x1="206" y1="402" x2="206" y2="264" />
  </g>
  <line x1="206" y1="286" x2="206" y2="234" class="tracejada" marker-end="url(#seta)" />
  <text class="estereotipo" x="258" y="256">«extend»</text>

  <!-- inclusões -->
  <line x1="484" y1="188" x2="570" y2="176" class="tracejada" marker-end="url(#seta)" />
  <text class="estereotipo" x="528" y="166">«include»</text>

  <line x1="480" y1="216" x2="578" y2="284" class="tracejada" marker-end="url(#seta)" />
  <text class="estereotipo" x="486" y="278">«include»</text>

  <!-- extensão -->
  <line x1="570" y1="568" x2="500" y2="620" class="tracejada" marker-end="url(#seta)" />
  <text class="estereotipo" x="604" y="606">«extend»</text>

  <line class="linha" x1="828" y1="168" x2="958" y2="196" />
</svg>
</section>

<!-- ============================================= 2. MODELO DE DADOS -->
<section>
<svg id="modelo-dados" width="1040" height="700" viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cx-cabecalho { fill: #1b4b7f; }
      .cx-corpo { fill: #fff; stroke: #1b4b7f; stroke-width: 1.7; }
    </style>
  </defs>

  <!-- usuario -->
  <g transform="translate(24,40)">
    <rect class="cx-corpo" x="0" y="0" width="238" height="94" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h230 a4,4 0 0 1 4,4 v28 h-238 z" />
    <text class="tabela-nome" x="12" y="24">usuario</text>
    <text class="campo-chave" x="12" y="58">PK  id</text>
    <text class="campo" x="12" y="82">    email (UQ)</text>
  </g>

  <!-- empresa -->
  <g transform="translate(24,352)">
    <rect class="cx-corpo" x="0" y="0" width="238" height="142" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h230 a4,4 0 0 1 4,4 v28 h-238 z" />
    <text class="tabela-nome" x="12" y="24">empresa</text>
    <text class="campo-chave" x="12" y="58">PK  id</text>
    <text class="campo" x="12" y="82">    cnpj (UQ)</text>
    <text class="campo" x="12" y="106">    razao_social</text>
    <text class="campo" x="12" y="130">    municipio, uf</text>
  </g>

  <!-- nota_fiscal -->
  <g transform="translate(360,150)">
    <rect class="cx-corpo" x="0" y="0" width="290" height="238" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h282 a4,4 0 0 1 4,4 v28 h-290 z" />
    <text class="tabela-nome" x="12" y="24">nota_fiscal</text>
    <text class="campo-chave" x="12" y="58">PK  id</text>
    <text class="campo-chave" x="12" y="82">FK  usuario_id</text>
    <text class="campo-chave" x="12" y="106">FK  empresa_id</text>
    <text class="campo" x="12" y="130">    chave_acesso</text>
    <text class="campo" x="12" y="154">    data_emissao</text>
    <text class="campo" x="12" y="178">    valor_total</text>
    <text class="campo" x="12" y="202">    valor_tributos</text>
    <text class="campo" x="12" y="226">    origem</text>
  </g>
  <text class="nota-modelo" x="360" y="410">UQ (usuario_id, chave_acesso)</text>

  <!-- item_nota -->
  <g transform="translate(748,150)">
    <rect class="cx-corpo" x="0" y="0" width="268" height="166" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h260 a4,4 0 0 1 4,4 v28 h-268 z" />
    <text class="tabela-nome" x="12" y="24">item_nota</text>
    <text class="campo-chave" x="12" y="58">PK  id</text>
    <text class="campo-chave" x="12" y="82">FK  nota_id</text>
    <text class="campo-chave" x="12" y="106">FK  produto_id</text>
    <text class="campo" x="12" y="130">    quantidade</text>
    <text class="campo" x="12" y="154">    valor_unitario</text>
  </g>

  <!-- produto -->
  <g transform="translate(748,436)">
    <rect class="cx-corpo" x="0" y="0" width="268" height="142" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h260 a4,4 0 0 1 4,4 v28 h-268 z" />
    <text class="tabela-nome" x="12" y="24">produto</text>
    <text class="campo-chave" x="12" y="58">PK  id</text>
    <text class="campo" x="12" y="82">    ean (UQ)</text>
    <text class="campo" x="12" y="106">    ncm</text>
    <text class="campo" x="12" y="130">    descricao</text>
  </g>

  <!-- preco_empresa_produto -->
  <g transform="translate(360,470)">
    <rect class="cx-corpo" x="0" y="0" width="290" height="142" rx="4" />
    <path class="cx-cabecalho" d="M0,4 a4,4 0 0 1 4,-4 h282 a4,4 0 0 1 4,4 v28 h-290 z" />
    <text class="tabela-nome" x="12" y="24">preco_empresa_produto</text>
    <text class="campo-chave" x="12" y="58">PK/FK  empresa_id</text>
    <text class="campo-chave" x="12" y="82">PK/FK  produto_id</text>
    <text class="campo" x="12" y="106">       valor_unitario</text>
    <text class="campo" x="12" y="130">       data_referencia</text>
  </g>

  <g class="linha">
    <path d="M262,90 H310 V200 H360" />
    <path d="M262,410 H310 V272 H360" />
    <path d="M650,206 H748" />
    <path d="M882,436 V316" />
    <path d="M143,494 V560 H360" />
    <path d="M748,494 H650" />
  </g>

  <g class="cardinalidade">
    <text x="274" y="82">1</text>
    <text x="334" y="192">N</text>
    <text x="274" y="402">1</text>
    <text x="334" y="266">N</text>
    <text x="662" y="198">1</text>
    <text x="716" y="198">N</text>
    <text x="890" y="428">1</text>
    <text x="890" y="340">N</text>
    <text x="150" y="516">1</text>
    <text x="336" y="552">N</text>
    <text x="722" y="488">1</text>
    <text x="662" y="488">N</text>
  </g>
</svg>
</section>

<!-- ================================================ 3. ARQUITETURA -->
<section>
<svg id="arquitetura" width="1040" height="620" viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d5b6b" />
    </marker>
  </defs>

  <rect x="24" y="24" width="992" height="112" rx="7" fill="#eef4fb" stroke="#2563a8" stroke-width="1.7" />
  <text class="camada-titulo" x="42" y="50">Cliente — PWA (React + Vite)</text>
  <g>
    <rect x="42" y="64" width="182" height="56" rx="5" fill="#fff" stroke="#2563a8" />
    <text class="componente" x="133" y="88">Leitura de QR</text>
    <text class="nota-arq" x="133" y="108">html5-qrcode</text>

    <rect x="238" y="64" width="182" height="56" rx="5" fill="#fff" stroke="#2563a8" />
    <text class="componente" x="329" y="88">Painel e relatórios</text>
    <text class="nota-arq" x="329" y="108">recharts</text>

    <rect x="434" y="64" width="182" height="56" rx="5" fill="#fff" stroke="#2563a8" />
    <text class="componente" x="525" y="88">Histórico e busca</text>
    <text class="nota-arq" x="525" y="108">react-router</text>

    <rect x="630" y="64" width="182" height="56" rx="5" fill="#fff" stroke="#2563a8" />
    <text class="componente" x="721" y="88">Estabelecimentos</text>

    <rect x="826" y="64" width="172" height="56" rx="5" fill="#fff" stroke="#2563a8" />
    <text class="componente" x="912" y="88">Sessão e HTTP</text>
    <text class="nota-arq" x="912" y="108">JWT</text>
  </g>

  <line x1="520" y1="136" x2="520" y2="182" class="linha" marker-end="url(#seta2)" />
  <text class="nota-arq" x="630" y="166">HTTPS · JSON · Bearer JWT</text>

  <rect x="24" y="188" width="992" height="262" rx="7" fill="#f7f9fc" stroke="#1b4b7f" stroke-width="1.7" />
  <text class="camada-titulo" x="42" y="214">Servidor — API REST (Node.js + Express)</text>

  <rect x="42" y="228" width="956" height="60" rx="5" fill="#fff" stroke="#4d5b6b" />
  <text class="camada-titulo" x="60" y="252">Rotas e middlewares</text>
  <text class="nota-arq" x="520" y="276">autenticação (JWT) · validação de entrada (zod) · tratamento de erros</text>

  <rect x="42" y="300" width="468" height="72" rx="5" fill="#fff" stroke="#4d5b6b" />
  <text class="camada-titulo" x="60" y="324">Serviços de aplicação</text>
  <text class="nota-arq" x="276" y="346">importarNota · compararComHistorico</text>
  <text class="nota-arq" x="276" y="364">produtosRecorrentes · resumoDoUsuario</text>

  <rect x="530" y="300" width="468" height="72" rx="5" fill="#fff" stroke="#4d5b6b" />
  <text class="camada-titulo" x="548" y="324">Domínio fiscal</text>
  <text class="nota-arq" x="764" y="346">chave de acesso (módulo 11)</text>
  <text class="nota-arq" x="764" y="364">identidade do produto (EAN/NCM)</text>

  <rect x="42" y="384" width="956" height="54" rx="5" fill="#eef4fb" stroke="#2563a8" stroke-dasharray="6 4" />
  <text class="camada-titulo" x="60" y="406">Porta de consulta de documentos fiscais</text>
  <text class="nota-arq" x="520" y="428">ProvedorXmlAutorizado · ProvedorSefaz · ProvedorInfosimples · ProvedorConsultaAssistida · ProvedorCatalogoLocal</text>

  <line x1="440" y1="450" x2="440" y2="500" class="linha" marker-end="url(#seta2)" />

  <rect x="196" y="506" width="488" height="76" rx="7" fill="#fff" stroke="#1b4b7f" stroke-width="1.7" />
  <text class="camada-titulo" x="440" y="536" text-anchor="middle">Persistência — SQLite (better-sqlite3)</text>
  <text class="nota-arq" x="440" y="560">6 tabelas · escrita transacional · chaves estrangeiras</text>

  <rect x="740" y="506" width="258" height="76" rx="7" fill="#f7f9fc" stroke="#7d8a99" stroke-dasharray="6 4" />
  <text class="camada-titulo" x="869" y="536" text-anchor="middle">Infosimples (externo)</text>
  <text class="nota-arq" x="869" y="560">consulta o portal da SEFAZ-PB</text>
  <line x1="869" y1="438" x2="869" y2="500" class="tracejada" marker-end="url(#seta2)" />
</svg>
</section>

</body>
</html>
