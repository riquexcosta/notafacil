# /etc/nginx/sites-available/notafacil
# Troque DOMINIO pelo endereço público. O HTTPS é incluído pelo certbot
# (certbot --nginx -d DOMINIO), que acrescenta o bloco 443 e o redirecionamento.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # XML de notas e exportação de dados cabem com folga em 6 MB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A consulta à Infosimples pode levar até ~20 s.
        proxy_read_timeout 60s;
    }
}
